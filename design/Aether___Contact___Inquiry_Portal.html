        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.5px', fontWeight: '700' }],

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&amp;family=Lato:wght@400;700&amp;family=Spline+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;

      vertical-align: middle;

    html, body {

      padding: 0;
      background-color: #F8F5EF;
    }
    .aether-glass {
      background: rgba(248, 245, 239, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(116, 90, 44, 0.08);
    }
    .sky-backdrop {
      background: radial-gradient(circle at 80% 15%, #F8F5EF 0%, #DCE8F0 52%, #EED8D0 100%);

  </style>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js" crossorigin></script>
</head>
<body class="bg-surface text-on-surface font-body antialiased selection:bg-primary-container selection:text-on-primary-container">
  <div id="root" class="min-h-screen w-full sky-backdrop flex flex-col"></div>

  <script>
    (function () {
      const e = React.createElement;
      const { useState, useEffect, useRef } = React;

      function PortalCanvas() {
        const mountRef = useRef(null);

        useEffect(() => {
          const el = mountRef.current;
          if (!el || typeof THREE === 'undefined') return;

          let renderer, scene, camera, frameId;
          try {
            const w = el.clientWidth || 380;
            const h = el.clientHeight || 220;
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#EEF2F5');

            camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 60);
            camera.position.set(0, 2.4, 7.2);
            camera.lookAt(0, 1.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            el.innerHTML = '';
            el.appendChild(renderer.domElement);

            scene.add(new THREE.HemisphereLight('#F8F5EF', '#EED8D0', 1.25));
            const sun = new THREE.DirectionalLight('#FFF5E4', 1.3);
            sun.position.set(5, 8, 6);
            scene.add(sun);

            const matIvory = new THREE.MeshStandardMaterial({ color: '#F8F5EF', roughness: 0.55 });
            const matGold = new THREE.MeshStandardMaterial({ color: '#B99A65', roughness: 0.28, metalness: 0.78 });
            const matGlass = new THREE.MeshPhysicalMaterial({ color: '#DCE8F0', roughness: 0.08, transparent: true, opacity: 0.55 });

            const portal = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.2, 0.45, 24), matIvory);
            portal.add(base);

            const arch = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.18, 14, 40, Math.PI), matGold);
            arch.position.y = 1.5;
            portal.add(arch);

            [[-1.5, 0], [1.5, 0]].forEach(([px]) => {
              const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 1.3, 12), matIvory);
              col.position.set(px, 0.85, 0);
              portal.add(col);
            });

            const veil = new THREE.Mesh(new THREE.CircleGeometry(1.32, 32), matGlass);
            veil.position.y = 1.5;
            portal.add(veil);

            const orb = new THREE.Mesh(new THREE.OctahedronGeometry(0.32, 0), matGold);
            orb.position.set(0, 1.5, 0.2);
            portal.add(orb);

            scene.add(portal);

            const clock = new THREE.Clock();
            function animate() {
              frameId = requestAnimationFrame(animate);
              const t = clock.getElapsedTime();
              portal.rotation.y = Math.sin(t * 0.35) * 0.35;
              orb.rotation.y += 0.02;
              orb.position.y = 1.5 + Math.sin(t * 1.8) * 0.12;
              renderer.render(scene, camera);
            }
            animate();

            return () => {
              cancelAnimationFrame(frameId);
              renderer.dispose();
            };
          } catch (err) {}
        }, []);

        return e('div', {
          ref: mountRef,
          className: 'w-full h-52 rounded-md overflow-hidden border border-champagne-gold/40',
          'aria-label': '3D Glowing Contact Portal'
        });
      }

      function ContactPortalApp() {
        const topics = ['Cloud & DevOps', 'Web Development', 'UI/UX Design', 'Collaboration'];
        const [selectedTopic, setSelectedTopic] = useState('Cloud & DevOps');
        const [name, setName] = useState('');
        const [email, setEmail] = useState('');
        const [subject, setSubject] = useState('');
        const [message, setMessage] = useState('');
        const [submitted, setSubmitted] = useState(false);

        const handleSubmit = (ev) => {
          ev.preventDefault();
          setSubmitted(true);
        };

        const mailtoHref = 'mailto:arjunarkmma@gmail.com?subject=' +
          encodeURIComponent('[' + selectedTopic + '] ' + (subject || 'Portfolio Inquiry')) +
          '&body=' + encodeURIComponent('From: ' + name + ' (' + email + ')\n\n' + message);

        return e('div', { className: 'min-h-screen w-full flex flex-col' },
          // Sticky Header
          e('header', { className: 'sticky top-0 z-20 aether-glass border-b border-champagne-gold/30 px-gutter-md sm:px-gutter-xl py-gutter-md' },
            e('div', { className: 'max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-gutter-md' },
              e('div', { className: 'flex items-center gap-gutter-sm' },
                e('span', { className: 'material-symbols-outlined text-primary text-headline-sm', 'aria-hidden': 'true' }, 'auto_awesome'),
                e('div', { className: 'flex flex-col' },
                  e('h1', { 'data-design-text-token': 'headline-sm', className: 'font-headline text-headline-sm text-on-surface leading-tight' }, 'The Contact Portal'),
                  e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, 'Aether — Arjun Jayraj')
                )
              ),
              e('span', { className: 'px-gutter-md py-gutter-xs rounded-full bg-secondary-container text-on-secondary-container font-label text-label-sm border border-sage-green' }, 'Bangalore, India')
            )
          ),

          // Main Content Grid
          e('main', { className: 'flex-1 max-w-6xl w-full mx-auto p-gutter-md sm:p-gutter-xl grid grid-cols-1 lg:grid-cols-12 gap-gutter-lg items-start' },
            // Left: 3D Portal & Direct Channels (5 cols)
            e('section', { 'aria-label': 'Direct Contact Channels', className: 'lg:col-span-5 flex flex-col gap-gutter-md' },
              e('div', { className: 'aether-glass rounded-lg border border-champagne-gold/40 p-gutter-lg flex flex-col gap-gutter-md' },
                e(PortalCanvas, null),
                e('div', { className: 'flex flex-col gap-gutter-xs' },
                  e('h2', { className: 'font-headline text-headline-sm text-on-surface' }, 'Let’s Work Together'),
                  e('p', { className: 'font-body text-body-md text-on-surface-variant text-pretty' },
                    'Have a cloud architecture, DevOps automation, or web development idea in mind? Reach out through the portal or connect directly below.'
                  )
                ),
                e('div', { className: 'flex flex-col gap-gutter-sm' },
                  e('a', {
                    href: 'mailto:arjunarkmma@gmail.com',
                    className: 'p-gutter-md rounded-DEFAULT bg-surface-container-low/90 border border-champagne-gold/35 hover:border-primary transition-colors flex items-center gap-gutter-md'
                  },
                    e('span', { className: 'material-symbols-outlined text-primary' }, 'mail'),
                    e('div', { className: 'flex flex-col' },
                      e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, 'Email'),
                      e('span', { className: 'font-body text-body-md font-bold text-on-surface' }, 'arjunarkmma@gmail.com')
                    )
                  ),
                  e('a', {
                    href: 'tel:+919035299301',
                    className: 'p-gutter-md rounded-DEFAULT bg-surface-container-low/90 border border-outline-variant/60 hover:border-primary transition-colors flex items-center gap-gutter-md'
                  },
                    e('span', { className: 'material-symbols-outlined text-primary' }, 'call'),
                    e('div', { className: 'flex flex-col' },
                      e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, 'Phone'),
                      e('span', { className: 'font-body text-body-md font-bold text-on-surface tabular-nums' }, '+91 9035299301')
                    )
                  ),
                  e('a', {
                    href: 'https://www.linkedin.com/in/arjun-jayraj-cloud',
                    target: '_blank',
                    rel: 'noopener noreferrer',
                    className: 'p-gutter-md rounded-DEFAULT bg-surface-container-low/90 border border-outline-variant/60 hover:border-primary transition-colors flex items-center justify-between gap-gutter-md'
                  },
                    e('div', { className: 'flex items-center gap-gutter-md' },
                      e('span', { className: 'material-symbols-outlined text-primary' }, 'person'),
                      e('div', { className: 'flex flex-col' },
                        e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, 'LinkedIn'),
                        e('span', { className: 'font-body text-body-md font-bold text-on-surface' }, 'arjun-jayraj-cloud')
                      )
                    ),
                    e('span', { className: 'material-symbols-outlined text-primary text-body-lg' }, 'open_in_new')
                  )
                )
              )
            ),

            // Right: Interactive Inquiry Form (7 cols)
            e('section', { 'aria-label': 'Interactive Inquiry Form', className: 'lg:col-span-7 aether-glass rounded-lg border border-champagne-gold/45 p-gutter-lg sm:p-gutter-xl flex flex-col gap-gutter-lg' },
              submitted
                ? e('div', { className: 'flex flex-col gap-gutter-md py-gutter-lg' },
                    e('div', { className: 'w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center' },
                      e('span', { className: 'material-symbols-outlined text-headline-sm' }, 'check_circle')
                    ),
                    e('h2', { className: 'font-headline text-headline-lg-mobile text-on-surface' }, 'Message Sent Across the Sky'),
                    e('p', { className: 'font-body text-body-lg text-on-surface-variant text-pretty' },
                      'Thank you, ' + (name || 'friend') + '. Your ' + selectedTopic + ' inquiry is ready. You can also launch it in your email client or send another note.'
                    ),
                    e('div', { className: 'p-gutter-md rounded-DEFAULT bg-surface-container-low border border-outline-variant/60 flex flex-col gap-gutter-xs' },
                      e('span', { className: 'font-label text-label-sm text-primary' }, selectedTopic + (subject ? ' — ' + subject : '')),
                      e('p', { className: 'font-body text-body-md text-on-surface' }, message)
                    ),
                    e('div', { className: 'flex flex-wrap gap-gutter-sm pt-gutter-sm' },
                      e('a', {
                        href: mailtoHref,
                        className: 'px-gutter-lg py-gutter-sm rounded-full bg-primary text-on-primary font-label text-label-lg hover:bg-on-primary-container transition-colors inline-flex items-center gap-gutter-xs'
                      },
                        e('span', { className: 'material-symbols-outlined text-body-lg' }, 'mail'),
                        e('span', null, 'Open in Email Client')
                      ),
                      e('button', {
                        type: 'button',
                        onClick: () => {
                          setSubmitted(false);
                          setSubject('');
                          setMessage('');
                        },
                        className: 'px-gutter-lg py-gutter-sm rounded-full bg-surface-container-low border border-outline-variant text-on-surface font-label text-label-lg hover:bg-primary-container transition-colors'
                      }, 'Send Another Inquiry')
                    )
                  )
                : e('form', { onSubmit: handleSubmit, className: 'flex flex-col gap-gutter-lg' },
                    e('div', { className: 'flex flex-col gap-gutter-xs' },
                      e('h2', { className: 'font-headline text-headline-lg-mobile text-on-surface' }, 'Send a Direct Inquiry'),
                      e('p', { className: 'font-body text-body-md text-on-surface-variant' }, 'Choose a focus area and share your project or collaboration details.')
                    ),

                    // Topic Selector Chips
                    e('div', { className: 'flex flex-col gap-gutter-xs' },
                      e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, 'Inquiry Focus'),
                      e('div', { className: 'flex flex-wrap gap-gutter-xs' },
                        topics.map((topic) => {
                          const isSelected = selectedTopic === topic;
                          return e('button', {
                            key: topic,
                            type: 'button',
                            'aria-pressed': isSelected ? 'true' : 'false',
                            onClick: () => setSelectedTopic(topic),
                            className: 'px-gutter-md py-gutter-xs rounded-full font-label text-label-sm border transition-colors ' +
                              (isSelected
                                ? 'bg-primary text-on-primary border-primary'
                                : 'bg-surface-container-low text-on-surface border-outline-variant/60 hover:bg-primary-container')
                          }, topic);
                        })
                      )
                    ),

                    // Name & Email Row
                    e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-gutter-md' },
                      e('label', { className: 'flex flex-col gap-gutter-xs' },
                        e('span', { className: 'font-label text-label-sm text-on-surface' }, 'Your Name'),
                        e('input', {
                          type: 'text',
                          required: true,
                          placeholder: 'Alex Rivera',
                          value: name,
                          onChange: (ev) => setName(ev.target.value),
                          className: 'w-full px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container-low border border-outline-variant text-on-surface font-body text-body-md focus:border-primary focus:ring-primary'
                        })
                      ),
                      e('label', { className: 'flex flex-col gap-gutter-xs' },
                        e('span', { className: 'font-label text-label-sm text-on-surface' }, 'Email Address'),
                        e('input', {
                          type: 'email',
                          required: true,
                          placeholder: 'alex@company.com',
                          value: email,
                          onChange: (ev) => setEmail(ev.target.value),
                          className: 'w-full px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container-low border border-outline-variant text-on-surface font-body text-body-md focus:border-primary focus:ring-primary'
                        })
                      )
                    ),

                    // Subject
                    e('label', { className: 'flex flex-col gap-gutter-xs' },
                      e('span', { className: 'font-label text-label-sm text-on-surface' }, 'Subject / Project Scope'),
                      e('input', {
                        type: 'text',
                        required: true,
                        placeholder: 'AWS Cloud Architecture & Web Platform',
                        value: subject,
                        onChange: (ev) => setSubject(ev.target.value),
                        className: 'w-full px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container-low border border-outline-variant text-on-surface font-body text-body-md focus:border-primary focus:ring-primary'
                      })
                    ),

                    // Message
                    e('label', { className: 'flex flex-col gap-gutter-xs' },
                      e('span', { className: 'font-label text-label-sm text-on-surface' }, 'Message'),
                      e('textarea', {
                        rows: 4,
                        required: true,
                        placeholder: 'Share your timeline, goals, or how we can collaborate...',
                        value: message,
                        onChange: (ev) => setMessage(ev.target.value),
                        className: 'w-full px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container-low border border-outline-variant text-on-surface font-body text-body-md focus:border-primary focus:ring-primary'
                      })
                    ),

                    // Submit
                    e('button', {
                      type: 'submit',
                      className: 'w-full py-gutter-md rounded-full bg-primary text-on-primary font-label text-label-lg uppercase tracking-wider hover:bg-on-primary-container transition-colors inline-flex items-center justify-center gap-gutter-xs shadow-sm'
                    },
                      e('span', { className: 'material-symbols-outlined text-body-lg', 'aria-hidden': 'true' }, 'send'),
                      e('span', null, 'Send Message')
                    )
                  )
            )
          )
        );
      }

      const rootEl = document.getElementById('root');
      if (rootEl && typeof ReactDOM !== 'undefined') {
        ReactDOM.createRoot(rootEl).render(e(ContactPortalApp));
      }
    })();
  </script>
