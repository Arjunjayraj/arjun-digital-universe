      // =========================================================================
      // 3D WORLD COMPONENT (Three.js + OrbitControls + Interactive Raycasting)
      // =========================================================================
      function AetherWorldCanvas(props) {
        const {
          entered,
          activeIslandId,
          onSelectIsland,
          reducedMotion,
          onSceneReady,
          onHoverIsland
        } = props;

        const mountRef = useRef(null);
        const stateRef = useRef({
          entered: false,
          activeIslandId: null,
          reducedMotion: false,
          cameraAnim: null,
          hoveredId: null
        });

        stateRef.current.entered = entered;
        stateRef.current.activeIslandId = activeIslandId;
        stateRef.current.reducedMotion = reducedMotion;

        // Trigger smooth camera flight when activeIslandId or entered changes
        useEffect(() => {
          const st = stateRef.current;
          if (!st.camera || !st.controls) return;

          let targetPos, targetLook;
          if (!entered) {
            targetPos = INTRO_CAMERA.pos;
            targetLook = INTRO_CAMERA.target;
          } else if (activeIslandId) {
            const isl = ISLANDS.find(i => i.id === activeIslandId);
            if (isl) {
              targetPos = isl.cameraPos;
              targetLook = isl.cameraTarget;
            }
          } else {
            targetPos = OVERVIEW_CAMERA.pos;
            targetLook = OVERVIEW_CAMERA.target;
          }

          if (targetPos && targetLook) {
            if (reducedMotion) {
              st.camera.position.set(targetPos[0], targetPos[1], targetPos[2]);
              st.controls.target.set(targetLook[0], targetLook[1], targetLook[2]);
              st.controls.update();
              st.cameraAnim = null;
            } else {
              st.cameraAnim = {
                startPos: st.camera.position.clone(),
                endPos: new THREE.Vector3(targetPos[0], targetPos[1], targetPos[2]),
                startLook: st.controls.target.clone(),
                endLook: new THREE.Vector3(targetLook[0], targetLook[1], targetLook[2]),
                progress: 0,
                duration: 1.45
              };
            }
          }
        }, [entered, activeIslandId, reducedMotion]);

        useEffect(() => {
          const container = mountRef.current;
          if (!container || typeof THREE === 'undefined') {
            onSceneReady();
            return;
          }

          let renderer, scene, camera, controls, frameId;
          try {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#E8EFF4');
            scene.fog = new THREE.FogExp2('#EAE6E1', 0.0115);

            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;

            camera = new THREE.PerspectiveCamera(44, width / height, 0.1, 220);
            camera.position.set(INTRO_CAMERA.pos[0], INTRO_CAMERA.pos[1], INTRO_CAMERA.pos[2]);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.055;
            controls.maxPolarAngle = Math.PI * 0.49;
            controls.minPolarAngle = 0.2;
            controls.minDistance = 6;
            controls.maxDistance = 62;
            controls.target.set(INTRO_CAMERA.target[0], INTRO_CAMERA.target[1], INTRO_CAMERA.target[2]);
            controls.update();

            stateRef.current.camera = camera;
            stateRef.current.controls = controls;

            // -----------------------------------------------------------------
            // LIGHTING (Soft Pastel Sun + Sky Hemisphere + Gold Accents)
            // -----------------------------------------------------------------
            const hemiLight = new THREE.HemisphereLight('#F8F5EF', '#EED8D0', 1.15);

            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight('#FFF5E4', 1.35);

            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 5;
            sunLight.shadow.camera.far = 110;
            const d = 34;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight('#DCE8F0', 0.55);
            fillLight.position.set(-22, 16, -18);
            scene.add(fillLight);

            // -----------------------------------------------------------------
            // MATERIALS
            // -----------------------------------------------------------------
            const matIvory = new THREE.MeshStandardMaterial({ color: '#F8F5EF', roughness: 0.55, metalness: 0.05 });
            const matLimestone = new THREE.MeshStandardMaterial({ color: '#E8DFD3', roughness: 0.85, metalness: 0.02, flatShading: true });
            const matSage = new THREE.MeshStandardMaterial({ color: '#C7D9CF', roughness: 0.78, metalness: 0.02 });

            const matBlush = new THREE.MeshStandardMaterial({ color: '#EED8D0', roughness: 0.72, metalness: 0.04 });

            // -----------------------------------------------------------------
            // HELPER: Build Floating Island Base
            // -----------------------------------------------------------------
            const clickableMeshes = [];
            const islandGroups = {};
            const floatingOrbs = [];
            const waterfallDrops = [];

            // Glowing champagne-gold selection halo ring for active/hovered island
            const ringGeo = new THREE.RingGeometry(5.9, 6.25, 48);
            const ringMat = new THREE.MeshBasicMaterial({
              color: '#B99A65',
              side: THREE.DoubleSide,
              transparent: true,

            });
            const selectionRing = new THREE.Mesh(ringGeo, ringMat);
            selectionRing.rotation.x = -Math.PI / 2;
            selectionRing.position.y = 0.6;
            scene.add(selectionRing);
            stateRef.current.selectionRing = selectionRing;
            stateRef.current.islandGroups = islandGroups;

            function createIslandBase(id, pos, radius, topMat) {
              const group = new THREE.Group();
              group.position.set(pos[0], pos[1], pos[2]);
              group.userData = { islandId: id, baseY: pos[1] };

              // Top lush terrace
              const topGeo = new THREE.CylinderGeometry(radius, radius * 0.92, 0.85, 16);
              const topMesh = new THREE.Mesh(topGeo, topMat);
              topMesh.receiveShadow = true;
              topMesh.castShadow = true;
              topMesh.userData = { islandId: id };
              group.add(topMesh);
              clickableMeshes.push(topMesh);

              rimMesh.rotation.x = Math.PI / 2;
              rimMesh.position.y = 0.36;
              group.add(rimMesh);

              const rockGeo = new THREE.ConeGeometry(radius * 0.9, radius * 1.35, 11);
              const rockMesh = new THREE.Mesh(rockGeo, matLimestone);
              rockMesh.rotation.x = Math.PI;
              rockMesh.position.y = -(radius * 0.68 + 0.35);
              rockMesh.castShadow = true;
              rockMesh.userData = { islandId: id };
              group.add(rockMesh);
              clickableMeshes.push(rockMesh);

              // Subtle floating crystal under island
              const crystalGeo = new THREE.OctahedronGeometry(0.55, 0);
              const crystal = new THREE.Mesh(crystalGeo, matGold);
              crystal.position.y = -(radius * 1.45 + 0.6);
              group.add(crystal);
              floatingOrbs.push({ mesh: crystal, baseY: crystal.position.y, speed: 1.4, phase: Math.random() * 6 });

              scene.add(group);
              islandGroups[id] = group;
              return group;
            }

            // -----------------------------------------------------------------
            // 1. THE HOME (Central Sanctuary + Castle + Waterfall + Pool)
            // -----------------------------------------------------------------
            const homeGroup = createIslandBase('home', [0, 0, 0], 5.8, matSage);

            // Central ivory pavilion / castle keep
            const keepBase = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.6, 2.2, 8), matIvory);
            keepBase.position.set(0, 1.4, -0.6);

            keepBase.receiveShadow = true;
            keepBase.userData = { islandId: 'home' };
            homeGroup.add(keepBase);
            clickableMeshes.push(keepBase);

            // Glass atrium dome
            const dome = new THREE.Mesh(new THREE.SphereGeometry(1.75, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), matGlass);
            dome.position.set(0, 2.5, -0.6);
            homeGroup.add(dome);

            // Gold finial spire
            const spire = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.4, 8), matGold);
            spire.position.set(0, 4.7, -0.6);
            homeGroup.add(spire);

            // Flanking fantasy towers
            [[-2.4, 0.2], [2.4, 0.2]].forEach(([tx, tz]) => {
              const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.78, 3.0, 10), matIvory);
              tower.position.set(tx, 1.8, tz);
              tower.castShadow = true;
              homeGroup.add(tower);
              const roof = new THREE.Mesh(new THREE.ConeGeometry(0.82, 1.3, 10), matBlush);
              roof.position.set(tx, 3.85, tz);
              roof.castShadow = true;
              homeGroup.add(roof);
            });

            // Reflective pool
            const pool = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 0.16, 24), matWater);
            pool.position.set(0, 0.44, 2.3);
            homeGroup.add(pool);

            // Flowing waterfall cascading off front-right edge
            for (let w = 0; w < 14; w++) {
              const drop = new THREE.Mesh(new THREE.SphereGeometry(0.22 + (w % 3) * 0.06, 8, 8), matWater);
              drop.position.set(1.6 + (Math.random() - 0.5) * 0.6, 0.3 - w * 0.45, 4.9 + (Math.random() - 0.5) * 0.25);
              homeGroup.add(drop);
              waterfallDrops.push({ mesh: drop, startY: 0.35, minY: -5.8, speed: 2.2 + Math.random() * 0.8 });
            }

            // -----------------------------------------------------------------
            // 2. THE KNOWLEDGE GARDEN (Trees, Flowers & 8 Orbiting Skill Crystals)
            // -----------------------------------------------------------------
            const gardenGroup = createIslandBase('garden', [-14, 0.8, -6], 4.6, matSage);

            // Stylized pastel fantasy trees
            [[-1.6, -1.2, 1.2], [1.8, -1.0, 1.0], [0.2, -2.0, 1.4]].forEach(([tx, tz, sc]) => {
              const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.22, 1.6 * sc, 7), matLimestone);
              trunk.position.set(tx, 0.4 + 0.8 * sc, tz);
              trunk.castShadow = true;
              gardenGroup.add(trunk);
              const foliage = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95 * sc, 1), tx < 0 ? matBlush : matLavender);
              foliage.position.set(tx, 0.4 + 1.85 * sc, tz);
              foliage.castShadow = true;
              gardenGroup.add(foliage);
            });

            // 8 orbiting skill crystals (AWS, Linux, Docker, Python, Git, Networking, SQL, Cloud)
            const skillMats = [matGold, matGlass, matLavender, matBlush];
            for (let i = 0; i < 8; i++) {
              const angle = (i / 8) * Math.PI * 2;
              const r = 3.1;
              const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.36, 0), skillMats[i % skillMats.length]);
              crystal.position.set(Math.cos(angle) * r, 2.2 + (i % 2) * 0.5, Math.sin(angle) * r);
              crystal.castShadow = true;
              crystal.userData = { islandId: 'garden' };
              gardenGroup.add(crystal);
              floatingOrbs.push({ mesh: crystal, baseY: crystal.position.y, speed: 1.6, phase: i * 0.8, orbitAngle: angle, orbitRadius: r, parentGroup: gardenGroup });
            }

            // -----------------------------------------------------------------
            // 3. THE PROJECT GALLERY (Floating Glass Museum & Holographic Displays)
            // -----------------------------------------------------------------
            const galleryGroup = createIslandBase('gallery', [14, 1.1, -6], 4.8, matIvory);

            // Glass museum pavilion
            const glassBox = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 3.0, 2.5, 6), matGlass);
            glassBox.position.set(0, 1.65, 0);
            glassBox.userData = { islandId: 'gallery' };
            galleryGroup.add(glassBox);
            clickableMeshes.push(glassBox);

            // Champagne gold roof ring
            const roofRing = new THREE.Mesh(new THREE.TorusGeometry(2.85, 0.14, 10, 24), matGold);
            roofRing.rotation.x = Math.PI / 2;
            roofRing.position.set(0, 2.95, 0);
            galleryGroup.add(roofRing);

            // Floating holographic project prisms
            for (let p = 0; p < 4; p++) {
              const ang = (p / 4) * Math.PI * 2 + 0.4;
              const holo = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.95, 0.12), matGlass);
              holo.position.set(Math.cos(ang) * 1.6, 1.6, Math.sin(ang) * 1.6);
              holo.lookAt(0, 1.6, 0);
              galleryGroup.add(holo);
              floatingOrbs.push({ mesh: holo, baseY: 1.6, speed: 1.3, phase: p * 1.4 });
            }

            // -----------------------------------------------------------------
            // 4. THE HALL OF ACHIEVEMENTS (Grand Colonnade & Golden Laurel)
            // -----------------------------------------------------------------
            const achGroup = createIslandBase('achievements', [-12.5, 0.4, 9.5], 4.4, matBlush);

            // Classical columns in a circle
            for (let c = 0; c < 6; c++) {
              const ang = (c / 6) * Math.PI * 2;
              const col = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 2.5, 10), matIvory);
              col.position.set(Math.cos(ang) * 2.2, 1.65, Math.sin(ang) * 2.2);
              col.castShadow = true;
              achGroup.add(col);
            }
            const achCrown = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.35, 16), matIvory);
            achCrown.position.set(0, 3.0, 0);
            achCrown.castShadow = true;
            achGroup.add(achCrown);

            const trophy = new THREE.Mesh(new THREE.OctahedronGeometry(0.65, 1), matGold);
            trophy.position.set(0, 1.7, 0);
            achGroup.add(trophy);
            floatingOrbs.push({ mesh: trophy, baseY: 1.7, speed: 1.5, phase: 0.5 });

            // -----------------------------------------------------------------
            // 5. THE LIBRARY (Tiered Rotunda & Floating Lanterns)
            // -----------------------------------------------------------------
            const libGroup = createIslandBase('library', [12.5, 0.6, 9.5], 4.4, matLavender);

            const libTier1 = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.5, 1.5, 12), matIvory);
            libTier1.position.set(0, 1.15, 0);
            libTier1.castShadow = true;
            libTier1.userData = { islandId: 'library' };
            libGroup.add(libTier1);
            clickableMeshes.push(libTier1);

            const libTier2 = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.6, 1.4, 12), matIvory);
            libTier2.position.set(0, 2.5, 0);
            libTier2.castShadow = true;
            libGroup.add(libTier2);

            const libRoof = new THREE.Mesh(new THREE.ConeGeometry(1.75, 1.5, 12), matGold);
            libRoof.position.set(0, 3.9, 0);
            libRoof.castShadow = true;
            libGroup.add(libRoof);

            // -----------------------------------------------------------------
            // 6. THE CONTACT PORTAL (Glowing Champagne-Gold Archway)
            // -----------------------------------------------------------------
            const portalGroup = createIslandBase('contact', [0, 1.2, 16.5], 4.2, matIvory);

            const arch = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.24, 14, 36, Math.PI), matGold);
            arch.position.set(0, 1.9, 0);
            arch.castShadow = true;
            arch.userData = { islandId: 'contact' };
            portalGroup.add(arch);
            clickableMeshes.push(arch);

            // Portal pillars
            [[-1.9, 0], [1.9, 0]].forEach(([px, pz]) => {
              const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 1.6, 10), matIvory);
              pillar.position.set(px, 1.15, pz);
              pillar.castShadow = true;
              portalGroup.add(pillar);
            });

            // Glowing portal veil
            const portalVeil = new THREE.Mesh(new THREE.CircleGeometry(1.7, 32), matGlass);
            portalVeil.position.set(0, 1.9, 0);
            portalGroup.add(portalVeil);

            // -----------------------------------------------------------------
            // ELEGANT BRIDGES CONNECTING THE HOME TO ISLANDS
            // -----------------------------------------------------------------
            function createBridge(p1, p2) {
              const v1 = new THREE.Vector3(p1[0], p1[1] + 0.35, p1[2]);
              const v2 = new THREE.Vector3(p2[0], p2[1] + 0.35, p2[2]);
              const mid = v1.clone().add(v2).multiplyScalar(0.5);
              mid.y += 1.4;
              const curve = new THREE.QuadraticBezierCurve3(v1, mid, v2);
              const bridgeGeo = new THREE.TubeGeometry(curve, 20, 0.24, 6, false);
              const bridge = new THREE.Mesh(bridgeGeo, matIvory);
              bridge.scale.set(1, 0.35, 1);
              bridge.castShadow = true;
              scene.add(bridge);
            }

            createBridge([0, 0, 0], [-14, 0.8, -6]);
            createBridge([0, 0, 0], [14, 1.1, -6]);
            createBridge([0, 0, 0], [-12.5, 0.4, 9.5]);
            createBridge([0, 0, 0], [12.5, 0.6, 9.5]);
            createBridge([0, 0, 0], [0, 1.2, 16.5]);

            // -----------------------------------------------------------------
            // SOFT DRIFTING CLOUDS
            // -----------------------------------------------------------------
            const clouds = [];
            for (let i = 0; i < 28; i++) {
              const cloudCluster = new THREE.Group();
              const puffs = 3 + (i % 3);
              for (let k = 0; k < puffs; k++) {
                const puff = new THREE.Mesh(
                  new THREE.SphereGeometry(1.6 + Math.random() * 1.8, 12, 10),
                  matCloud
                );
                puff.position.set((k - 1) * 1.8, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 1.2);
                puff.scale.y = 0.55;
                cloudCluster.add(puff);
              }
              const angle = Math.random() * Math.PI * 2;
              const dist = 12 + Math.random() * 34;
              cloudCluster.position.set(
                Math.cos(angle) * dist,
                -6.5 + Math.random() * 5.0,
                Math.sin(angle) * dist
              );
              scene.add(cloudCluster);
              clouds.push({ group: cloudCluster, speed: 0.15 + Math.random() * 0.22 });
            }

            // -----------------------------------------------------------------
            // FLOATING GOLDEN PARTICLES & BIRDS
            // -----------------------------------------------------------------
            const particleCount = 160;
            const particleGeo = new THREE.BufferGeometry();
            const particlePos = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
              particlePos[i * 3] = (Math.random() - 0.5) * 56;
              particlePos[i * 3 + 1] = -3 + Math.random() * 18;
              particlePos[i * 3 + 2] = (Math.random() - 0.5) * 56;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
            const particleMat = new THREE.PointsMaterial({
              color: '#B99A65',
              size: 0.22,
              transparent: true,
              opacity: 0.65
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // Sky Birds
            const birds = [];
            for (let b = 0; b < 7; b++) {
              const bird = new THREE.Group();
              const wingGeo = new THREE.BoxGeometry(0.55, 0.04, 0.16);
              const leftWing = new THREE.Mesh(wingGeo, matIvory);
              leftWing.position.x = -0.28;
              const rightWing = new THREE.Mesh(wingGeo, matIvory);
              rightWing.position.x = 0.28;
              bird.add(leftWing);
              bird.add(rightWing);
              const r = 10 + b * 2.5;
              const a = b * 1.1;
              bird.position.set(Math.cos(a) * r, 7 + (b % 3) * 1.5, Math.sin(a) * r);
              scene.add(bird);
              birds.push({ group: bird, leftWing, rightWing, radius: r, angle: a, speed: 0.16 + (b % 3) * 0.04, yBase: bird.position.y });
            }

            // -----------------------------------------------------------------
            // RAYCASTER FOR CLICKING & HOVERING ISLANDS
            // -----------------------------------------------------------------
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            let downPos = { x: 0, y: 0 };

            function getPointerIntersection(clientX, clientY) {
              const rect = renderer.domElement.getBoundingClientRect();
              pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
              pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
              raycaster.setFromCamera(pointer, camera);
              const hits = raycaster.intersectObjects(clickableMeshes, false);
              if (hits.length > 0 && hits[0].object.userData && hits[0].object.userData.islandId) {
                return hits[0].object.userData.islandId;
              }
              return null;
            }

            const onPointerDown = (ev) => {
              downPos = { x: ev.clientX, y: ev.clientY };
            };

            const onPointerMove = (ev) => {
              if (!stateRef.current.entered) return;
              const hitId = getPointerIntersection(ev.clientX, ev.clientY);
              renderer.domElement.style.cursor = hitId ? 'pointer' : 'grab';
              if (stateRef.current.hoveredId !== hitId) {
                stateRef.current.hoveredId = hitId;
                onHoverIsland(hitId);
              }
            };

            const onPointerUp = (ev) => {
              if (!stateRef.current.entered) return;
              const dx = ev.clientX - downPos.x;
              const dy = ev.clientY - downPos.y;
              if (Math.hypot(dx, dy) < 6) {
                const hitId = getPointerIntersection(ev.clientX, ev.clientY);
                if (hitId) {
                  onSelectIsland(hitId);
                }
              }
            };

            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);

            // Resize handler
            const onResize = () => {
              if (!container) return;
              const w = container.clientWidth || window.innerWidth;
              const h = container.clientHeight || window.innerHeight;
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              renderer.setSize(w, h);
            };
            window.addEventListener('resize', onResize);

            // Signal ready
            onSceneReady();

            // -----------------------------------------------------------------
            // ANIMATION LOOP
            // -----------------------------------------------------------------
            const clock = new THREE.Clock();
            function animate() {
              frameId = requestAnimationFrame(animate);
              const dt = Math.min(clock.getDelta(), 0.05);
              const elapsed = clock.getElapsedTime();
              const rm = stateRef.current.reducedMotion;

              // Camera intro slow drift before entering
              if (!stateRef.current.entered && !rm) {
                const angle = elapsed * 0.09;
                camera.position.x = Math.sin(angle) * 6;
                camera.position.z = 24 + Math.cos(angle) * 2;
                camera.lookAt(0, 1.8, 0);
              }

              // Smooth camera transition
              if (stateRef.current.cameraAnim) {
                const anim = stateRef.current.cameraAnim;
                anim.progress += dt / anim.duration;
                const t = Math.min(anim.progress, 1);
                // Cubic ease in-out
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                camera.position.lerpVectors(anim.startPos, anim.endPos, ease);
                controls.target.lerpVectors(anim.startLook, anim.endLook, ease);
                if (t >= 1) {
                  stateRef.current.cameraAnim = null;
                }
              }

              if (!rm) {
                // Gentle island bobbing
                Object.keys(islandGroups).forEach((key, idx) => {
                  const grp = islandGroups[key];
                  grp.position.y = grp.userData.baseY + Math.sin(elapsed * 0.7 + idx * 1.1) * 0.16;
                });

                // Orbiting skill crystals & holo displays
                floatingOrbs.forEach((orb) => {
                  orb.mesh.rotation.y += dt * 0.7;
                  orb.mesh.position.y = orb.baseY + Math.sin(elapsed * orb.speed + orb.phase) * 0.18;
                  if (orb.orbitRadius) {
                    const a = orb.orbitAngle + elapsed * 0.22;
                    orb.mesh.position.x = Math.cos(a) * orb.orbitRadius;
                    orb.mesh.position.z = Math.sin(a) * orb.orbitRadius;
                  }
                });

                // Waterfall drops
                waterfallDrops.forEach((drop) => {
                  drop.mesh.position.y -= dt * drop.speed;
                  if (drop.mesh.position.y < drop.minY) {
                    drop.mesh.position.y = drop.startY;
                  }
                });

                // Drifting clouds
                clouds.forEach((c) => {
                  c.group.position.x += dt * c.speed;
                  if (c.group.position.x > 46) c.group.position.x = -46;
                });

                // Birds circling
                birds.forEach((b) => {
                  b.angle += dt * b.speed;
                  b.group.position.x = Math.cos(b.angle) * b.radius;
                  b.group.position.z = Math.sin(b.angle) * b.radius;
                  b.group.position.y = b.yBase + Math.sin(elapsed * 1.8 + b.angle) * 0.35;
                  b.group.rotation.y = -b.angle;
                  const flap = Math.sin(elapsed * 7 + b.angle) * 0.35;
                  b.leftWing.rotation.z = flap;
                  b.rightWing.rotation.z = -flap;
                });

                // Gentle particle drift
                particles.rotation.y = elapsed * 0.02;
              }

              // Animate selection halo ring under active or hovered island
              const targetRingId = stateRef.current.activeIslandId || stateRef.current.hoveredId;
              if (targetRingId && islandGroups[targetRingId]) {
                const grp = islandGroups[targetRingId];
                selectionRing.position.set(grp.position.x, grp.position.y + 0.48, grp.position.z);
                const pulse = rm ? 1 : 1 + Math.sin(elapsed * 2.4) * 0.035;
                const scaleBase = targetRingId === 'home' ? 1.05 : 0.85;
                selectionRing.scale.setScalar(scaleBase * pulse);
                selectionRing.material.opacity = stateRef.current.activeIslandId ? 0.55 : 0.35;
              } else {
                selectionRing.material.opacity = 0;
              }

              controls.update();
              renderer.render(scene, camera);

              // Project 3D island & skill crystal positions to 2D overlay labels
              const labelLayer = stateRef.current.labelLayer;
              if (labelLayer) {
                const cw = container.clientWidth || window.innerWidth;
                const ch = container.clientHeight || window.innerHeight;
                const showIslands = stateRef.current.entered && !stateRef.current.activeIslandId;
                const showSkills = stateRef.current.entered && stateRef.current.activeIslandId === 'garden';

                ISLANDS.forEach((isl) => {
                  const el = labelLayer.querySelector('[data-beacon="' + isl.id + '"]');
                  if (!el) return;
                  if (!showIslands) {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    return;
                  }
                  const grp = islandGroups[isl.id];
                  const worldPos = new THREE.Vector3(
                    isl.position[0],
                    (grp ? grp.position.y : isl.position[1]) + 4.4,
                    isl.position[2]
                  );
                  worldPos.project(camera);
                  if (worldPos.z > 1) {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                  } else {
                    const sx = (worldPos.x * 0.5 + 0.5) * cw;
                    const sy = (-worldPos.y * 0.5 + 0.5) * ch;
                    el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px, ' + sy.toFixed(1) + 'px, 0) translate(-50%, -50%)';
                    el.style.opacity = '1';
                    el.style.pointerEvents = 'auto';
                  }
                });

                SKILLS_ORBIT.forEach((sk, idx) => {
                  const el = labelLayer.querySelector('[data-skill-beacon="' + idx + '"]');
                  if (!el) return;
                  if (!showSkills) {
                    el.style.opacity = '0';
                    return;
                  }
                  const orb = floatingOrbs.find(o => o.parentGroup === gardenGroup && o.phase === idx * 0.8);
                  if (!orb) return;
                  const worldPos = new THREE.Vector3();
                  orb.mesh.getWorldPosition(worldPos);
                  worldPos.y += 0.7;
                  worldPos.project(camera);
                  if (worldPos.z > 1) {
                    el.style.opacity = '0';
                  } else {
                    const sx = (worldPos.x * 0.5 + 0.5) * cw;
                    const sy = (-worldPos.y * 0.5 + 0.5) * ch;
                    el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px, ' + sy.toFixed(1) + 'px, 0) translate(-50%, -50%)';
                    el.style.opacity = '1';
                  }
                });
              }
            }
            animate();

            return () => {
              cancelAnimationFrame(frameId);
              window.removeEventListener('resize', onResize);
              renderer.domElement.removeEventListener('pointerdown', onPointerDown);
              renderer.domElement.removeEventListener('pointermove', onPointerMove);
              renderer.domElement.removeEventListener('pointerup', onPointerUp);
              controls.dispose();
              renderer.dispose();
              if (renderer.domElement && renderer.domElement.parentNode === container) {
                container.removeChild(renderer.domElement);
              }
            };
          } catch (err) {
            // Graceful fallback if WebGL is unavailable in headless/software environments
            onSceneReady();
          }
        }, []);

        return e(React.Fragment, null,
          e('div', {
            ref: mountRef,
            className: 'fixed inset-0 z-0 w-full h-full',
            'aria-label': 'Interactive 3D Fantasy World of Arjun Jayraj'
          }),
          e('div', {
            ref: (el) => { stateRef.current.labelLayer = el; },
            className: 'fixed inset-0 z-10 pointer-events-none overflow-hidden'
          },
            ISLANDS.map((isl) =>
              e('button', {
                key: isl.id,
                'data-beacon': isl.id,
                type: 'button',
                onClick: () => onSelectIsland(isl.id),
                style: { opacity: 0, pointerEvents: 'none', transition: 'opacity 250ms ease' },
                className: 'hidden sm:inline-flex absolute top-0 left-0 aether-glass items-center gap-gutter-xs px-gutter-sm py-gutter-xs rounded-full border border-champagne-gold/50 hover:border-primary hover:bg-primary-container/80 text-on-surface shadow-sm cursor-pointer'
              },
                e('span', { className: 'font-label text-label-sm text-primary' }, isl.number),
                e('span', { className: 'font-headline text-body-md font-semibold text-on-surface whitespace-nowrap' }, isl.name)
              )
            ),
            SKILLS_ORBIT.map((sk, idx) =>
              e('div', {
                key: sk.name,
                'data-skill-beacon': idx,
                style: { opacity: 0, transition: 'opacity 250ms ease' },
                className: 'hidden sm:inline-flex absolute top-0 left-0 aether-glass items-center px-gutter-sm py-gutter-xs rounded-full border border-sage-green text-on-secondary-container pointer-events-none'
              },
                e('span', { className: 'font-label text-label-sm font-bold whitespace-nowrap' }, sk.name)
              )
            )
          )
        );
      }

      // =========================================================================
      // INTERACTIVE 3D PROJECT MODEL VIEWER (Drag to rotate + Wireframe toggle)
      // =========================================================================
      function ProjectModelViewer({ project, reducedMotion }) {
        const viewerRef = useRef(null);
        const [wireframe, setWireframe] = useState(false);
        const [autoSpin, setAutoSpin] = useState(!reducedMotion);
        const stateRef = useRef({ wireframe: false, autoSpin: !reducedMotion });

        stateRef.current.wireframe = wireframe;
        stateRef.current.autoSpin = autoSpin;

        useEffect(() => {
          const el = viewerRef.current;
          if (!el || typeof THREE === 'undefined') return;

          let renderer, scene, camera, controls, frameId, mainGroup;
          try {
            const w = el.clientWidth || 360;
            const h = el.clientHeight || 200;
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#EEF3F7');

            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 50);
            camera.position.set(0, 1.4, 4.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            el.innerHTML = '';
            el.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.enableZoom = true;
            controls.minDistance = 2.4;
            controls.maxDistance = 6.5;

            const hemi = new THREE.HemisphereLight('#F8F5EF', '#DCD2E8', 1.2);
            scene.add(hemi);
            const dir = new THREE.DirectionalLight('#FFF5E4', 1.3);
            dir.position.set(4, 6, 4);
            scene.add(dir);

            mainGroup = new THREE.Group();
            const matGold = new THREE.MeshStandardMaterial({ color: '#B99A65', roughness: 0.25, metalness: 0.78 });
            const matGlass = new THREE.MeshPhysicalMaterial({ color: '#DCE8F0', roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.62 });
            const matSage = new THREE.MeshStandardMaterial({ color: '#C7D9CF', roughness: 0.5, metalness: 0.15 });
            const matLav = new THREE.MeshStandardMaterial({ color: '#DCD2E8', roughness: 0.45, metalness: 0.2 });

            if (project.id === 'careerpilot') {
              const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), matGlass);
              const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.04, 12, 48), matGold);
              const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.03, 12, 48), matLav);
              ring2.rotation.x = Math.PI / 3;
              mainGroup.add(core, ring1, ring2);
            } else if (project.id === 'findcart') {
              const box = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15), matGlass);
              const frame = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.05, 10, 4), matGold);
              frame.rotation.z = Math.PI / 4;
              const orb = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), matGold);
              mainGroup.add(box, frame, orb);
            } else if (project.id === 'cloud-migration') {
              for (let i = 0; i < 3; i++) {
                const layer = new THREE.Mesh(new THREE.CylinderGeometry(1.0 - i * 0.2, 1.1 - i * 0.2, 0.28, 6), i === 1 ? matGold : matSage);
                layer.position.y = (i - 1) * 0.52;
                mainGroup.add(layer);
              }
            } else {
              const prism = new THREE.Mesh(new THREE.OctahedronGeometry(0.95, 0), matGlass);
              const halo = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.04, 10, 36), matGold);
              halo.rotation.x = Math.PI / 2.4;
              mainGroup.add(prism, halo);
            }

            scene.add(mainGroup);

            const clock = new THREE.Clock();
            function tick() {
              frameId = requestAnimationFrame(tick);
              const dt = Math.min(clock.getDelta(), 0.05);
              mainGroup.traverse((obj) => {
                if (obj.isMesh && obj.material) {
                  obj.material.wireframe = stateRef.current.wireframe;
                }
              });
              if (stateRef.current.autoSpin) {
                mainGroup.rotation.y += dt * 0.55;
              }
              controls.update();
              renderer.render(scene, camera);
            }
            tick();

            return () => {
              cancelAnimationFrame(frameId);
              controls.dispose();
              renderer.dispose();
            };
          } catch (err) {
            // Graceful fallback if WebGL unavailable
          }
        }, [project.id]);

                    value: senderMsg,
                    onChange: (ev) => setSenderMsg(ev.target.value),
                    className: 'w-full px-gutter-md py-gutter-sm rounded-DEFAULT bg-surface-container-low border border-outline-variant text-on-surface font-body text-body-md focus:border-primary focus:ring-primary'
                  }),
                  e('button', {
                    type: 'submit',
                    className: 'w-full py-gutter-sm rounded-full bg-primary text-on-primary font-label text-label-lg hover:bg-on-primary-container transition-colors'
                  }, 'Send Message')
                )
          );
        }

        return null;
      }

      // =========================================================================
      // MAIN APP SHELL
      // =========================================================================
      function AetherApp() {
        const [sceneReady, setSceneReady] = useState(false);
        const [entered, setEntered] = useState(false);
        const [activeIslandId, setActiveIslandId] = useState(null);
        const [hoveredIslandId, setHoveredIslandId] = useState(null);
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [reducedMotion, setReducedMotion] = useState(() => {
          try {
            return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          } catch (err) {
            return false;
          }
        });

        // Keyboard shortcuts: Escape returns to sky or closes panel; 1-6 jump to islands
        useEffect(() => {
          const onKeyDown = (ev) => {
            if (!entered) {
              if (ev.key === 'Enter') setEntered(true);
              return;
            }
            if (ev.key === 'Escape') {
              if (mobileMenuOpen) setMobileMenuOpen(false);
              else if (activeIslandId) setActiveIslandId(null);
            }
            const num = parseInt(ev.key, 10);
            if (num >= 1 && num <= 6 && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
              setActiveIslandId(ISLANDS[num - 1].id);
            } else if (ev.key === '0' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
              setActiveIslandId(null);
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [entered, activeIslandId, mobileMenuOpen]);

        const activeIsland = ISLANDS.find(i => i.id === activeIslandId) || null;
        const hoveredIsland = ISLANDS.find(i => i.id === hoveredIslandId) || null;

        return e('div', { className: 'relative min-h-screen w-full overflow-hidden flex flex-col justify-between' },

          // 1. REAL-TIME 3D FANTASY WORLD
          e(AetherWorldCanvas, {
            entered,
            activeIslandId,
            onSelectIsland: (id) => setActiveIslandId(id),
            reducedMotion,
            onSceneReady: () => setSceneReady(true),
            onHoverIsland: (id) => setHoveredIslandId(id)
          }),

          // 2. LOADING VEIL (fades out once 3D world mounts)
          !sceneReady && e('div', {
            className: 'fixed inset-0 z-50 bg-surface flex flex-col items-center justify-center gap-gutter-md'
          },
            e('div', { className: 'w-10 h-10 rounded-full border-2 border-champagne-gold/30 border-t-primary animate-spin' }),
            e('span', { className: 'font-label text-label-sm uppercase tracking-widest text-primary' }, 'Awakening Aether...')
          ),

          // 3. CINEMATIC OPENING SCREEN (Before "ENTER MY WORLD")
          !entered && e('main', {
            className: 'relative z-20 min-h-screen w-full flex flex-col items-center justify-center p-gutter-lg text-center pointer-events-none'
          },
            e('div', {
              className: 'aether-glass max-w-2xl w-full p-gutter-xl sm:p-section rounded-lg border border-champagne-gold/40 flex flex-col items-center gap-gutter-md pointer-events-auto animate-float-slow'
            },
              e('span', {
                'data-design-text-token': 'label-sm',
                className: 'font-label text-label-sm uppercase tracking-widest text-primary px-gutter-md py-gutter-xs rounded-full bg-primary-container/70 border border-champagne-gold/30'
              }, 'Aether — 3D Sanctuary'),

              e('h1', {
                'data-design-text-token': 'display-lg',
                className: 'font-display text-display-lg-mobile sm:text-display-lg text-on-surface tracking-tight text-balance'
              }, 'ARJUN JAYRAJ'),

              e('p', {
                'data-design-text-token': 'headline-sm',
                className: 'font-headline text-headline-sm italic text-primary text-balance'
              }, '“Exploring Ideas. Building Possibilities.”'),

              e('p', {
                'data-design-text-token': 'body-lg',
                className: 'font-body text-body-lg text-on-surface-variant max-w-prose text-pretty'
              }, 'Cloud Computing Student | Aspiring DevOps Engineer | Technology Enthusiast.'),

              e('div', { className: 'pt-gutter-sm flex flex-col items-center gap-gutter-sm' },
                e('button', {
                  'data-component-id': 'button-primary',
                  'data-component-type': 'button',
                  'data-component-variant': 'primary',
                  type: 'button',
                  onClick: () => setEntered(true),
                  className: 'inline-flex items-center justify-center gap-gutter-sm px-gutter-xl py-gutter-md rounded-full bg-primary text-on-primary shadow-md transition-colors duration-state-change ease-state-change hover:bg-on-primary-container focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-champagne-gold focus-visible:ring-offset-2'
                },
                  e('span', { className: 'material-symbols-outlined text-title-md', 'aria-hidden': 'true' }, 'explore'),
                  e('span', { 'data-design-text-token': 'label-lg', className: 'font-label text-label-lg uppercase tracking-widest' }, 'ENTER MY WORLD')
                ),
                e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, 'Drag to orbit • Scroll to zoom • Click any floating island')
              )
            )
          ),

          // 4. EXPLORATION HUD (Visible after entering the world)
          entered && e(React.Fragment, null,
            // TOP BAR
            e('header', {
              className: 'relative z-20 w-full p-gutter-md sm:p-gutter-lg flex items-center justify-between gap-gutter-md pointer-events-none'
            },
              // Brand / Return to Overview
              e('button', {
                type: 'button',
                onClick: () => setActiveIslandId(null),
                className: 'aether-glass pointer-events-auto inline-flex items-center gap-gutter-sm px-gutter-md py-gutter-sm rounded-full border border-champagne-gold/40 hover:border-champagne-gold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-champagne-gold'
              },
                e('span', { className: 'material-symbols-outlined text-primary text-title-md', 'aria-hidden': 'true' }, 'cloud'),
                e('span', { className: 'font-headline text-title-md text-on-surface font-semibold tracking-wide' }, 'AETHER'),
                e('span', { className: 'hidden sm:inline font-label text-label-sm text-on-surface-variant' }, '— Arjun Jayraj')
              ),

              // Right Controls: Return to Sky, Reduced Motion toggle, Mobile Menu
              e('div', { className: 'flex items-center gap-gutter-sm pointer-events-auto' },
                activeIslandId && e('button', {
                  'data-component-id': 'button-secondary',
                  'data-component-type': 'button',
                  'data-component-variant': 'secondary',
                  type: 'button',
                  onClick: () => setActiveIslandId(null),
                  className: 'aether-glass inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-sm rounded-full border border-champagne-gold/40 text-on-surface font-label text-label-sm hover:bg-primary-container transition-colors'
                },
                  e('span', { className: 'material-symbols-outlined text-body-lg text-primary', 'aria-hidden': 'true' }, 'public'),
                  e('span', null, 'Return to Sky')
                ),
                e('button', {
                  type: 'button',
                  onClick: () => setReducedMotion(v => !v),
                  'aria-pressed': reducedMotion ? 'true' : 'false',
                  title: reducedMotion ? 'Enable Ambient Motion' : 'Reduce Motion',
                  className: 'aether-glass inline-flex items-center justify-center w-10 h-10 rounded-full border border-outline-variant/60 text-on-surface hover:border-champagne-gold transition-colors'
                },
                  e('span', { className: 'material-symbols-outlined text-title-md text-primary' }, reducedMotion ? 'pause_circle' : 'motion_photos_on')
                ),
                e('button', {
                  type: 'button',
                  onClick: () => setMobileMenuOpen(v => !v),
                  'aria-label': 'Toggle World Map Menu',
                  className: 'lg:hidden aether-glass inline-flex items-center justify-center w-10 h-10 rounded-full border border-champagne-gold/40 text-on-surface'
                },
                  e('span', { className: 'material-symbols-outlined text-title-md text-primary' }, mobileMenuOpen ? 'close' : 'menu')
                )
              )
            ),

            // HOVER TOOLTIP PILL (When hovering a 3D island)
            hoveredIsland && !activeIsland && e('div', {
              className: 'fixed top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-none'
            },
              e('div', { className: 'aether-glass px-gutter-md py-gutter-xs rounded-full border border-champagne-gold/50 flex items-center gap-gutter-sm' },
                e('span', { className: 'font-label text-label-sm text-primary' }, hoveredIsland.number),
                e('span', { className: 'font-headline text-body-lg font-semibold text-on-surface' }, hoveredIsland.name),
                e('span', { className: 'font-body text-body-md text-on-surface-variant hidden sm:inline' }, '— Click to explore')
              )
            ),

            // MOBILE FALLBACK NAVIGATION DRAWER
            mobileMenuOpen && e('nav', {
              'aria-label': 'Island Locations',
              className: 'lg:hidden fixed inset-x-4 top-20 z-30 aether-glass-strong rounded-lg border border-champagne-gold/40 p-gutter-md flex flex-col gap-gutter-xs'
            },
              ISLANDS.map((isl) =>
                e('button', {
                  key: isl.id,
                  type: 'button',
                  onClick: () => {
                    setActiveIslandId(isl.id);
                    setMobileMenuOpen(false);
                  },
                  className: 'w-full p-gutter-sm rounded-DEFAULT flex items-center justify-between text-left transition-colors ' +
                    (activeIslandId === isl.id ? 'bg-primary text-on-primary' : 'hover:bg-primary-container/60 text-on-surface')
                },
                  e('div', { className: 'flex items-center gap-gutter-sm' },
                    e('span', { className: 'material-symbols-outlined text-title-md' }, isl.icon),
                    e('span', { className: 'font-body text-body-md font-bold' }, isl.name)
                  ),
                  e('span', { className: 'font-label text-label-sm opacity-75' }, isl.number)
                )
              )
            ),

            // ACTIVE ISLAND INFORMATION DRAWER (Right side on desktop, bottom sheet on mobile)
            activeIsland && e('aside', {
              'aria-label': activeIsland.name + ' Details',
              className: 'fixed z-30 bottom-20 left-4 right-4 sm:left-auto sm:right-6 sm:top-24 sm:bottom-24 sm:w-[440px] aether-glass-strong rounded-lg border border-champagne-gold/45 flex flex-col overflow-hidden pointer-events-auto'
            },
              // Drawer Header
              e('header', { className: 'p-gutter-lg border-b border-outline-variant/40 flex items-start justify-between gap-gutter-md' },
                e('div', { className: 'flex flex-col gap-gutter-xs' },
                  e('div', { className: 'flex items-center gap-gutter-sm' },
                    e('span', { className: 'px-gutter-sm py-gutter-xs rounded-full font-label text-label-sm ' + activeIsland.accentClass }, 'Location ' + activeIsland.number),
                    e('span', { className: 'font-label text-label-sm text-on-surface-variant' }, activeIsland.subtitle)
                  ),
                  e('h2', {
                    'data-design-text-token': 'headline-lg',
                    className: 'font-headline text-headline-lg-mobile sm:text-headline-lg text-on-surface'
                  }, activeIsland.name)
                ),
                e('button', {
                  'data-component-id': 'button-icon',
                  'data-component-type': 'button',
                  'data-component-variant': 'icon',
                  type: 'button',
                  'aria-label': 'Close island panel',
                  onClick: () => setActiveIslandId(null),
                  className: 'inline-flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface hover:bg-primary-container transition-colors shrink-0'
                },
                  e('span', { className: 'material-symbols-outlined text-title-md' }, 'close')
                )
              ),
              // Scrollable Drawer Body
              e('div', { className: 'p-gutter-lg overflow-y-auto aether-scroll flex-1 max-h-[55vh] sm:max-h-none' },
                e('p', { className: 'font-body text-body-md text-on-surface-variant mb-gutter-md pb-gutter-md border-b border-outline-variant/30 text-pretty' }, activeIsland.summary),
                e(IslandPanelContent, {
                  islandId: activeIsland.id,
                  onNavigate: (id) => setActiveIslandId(id),
                  reducedMotion
                })
              ),
              // Sequential Island Tour Footer
              e('footer', { className: 'px-gutter-lg py-gutter-sm border-t border-outline-variant/40 bg-surface-container-low/60 flex items-center justify-between gap-gutter-sm' },
                (() => {
                  const idx = ISLANDS.findIndex(i => i.id === activeIsland.id);
                  const prevIsl = ISLANDS[(idx - 1 + ISLANDS.length) % ISLANDS.length];
                  const nextIsl = ISLANDS[(idx + 1) % ISLANDS.length];
                  return e(React.Fragment, null,
                    e('button', {
                      type: 'button',
                      onClick: () => setActiveIslandId(prevIsl.id),
                      className: 'inline-flex items-center gap-gutter-xs px-gutter-sm py-gutter-xs rounded-full text-on-surface-variant hover:text-primary hover:bg-primary-container/50 transition-colors font-label text-label-sm'
                    },
                      e('span', { className: 'material-symbols-outlined text-body-md' }, 'arrow_back'),
                      e('span', null, prevIsl.name)
                    ),
                    e('button', {
                      type: 'button',
                      onClick: () => setActiveIslandId(nextIsl.id),
                      className: 'inline-flex items-center gap-gutter-xs px-gutter-sm py-gutter-xs rounded-full text-primary hover:bg-primary-container/60 transition-colors font-label text-label-sm font-bold'
                    },
                      e('span', null, nextIsl.name),
                      e('span', { className: 'material-symbols-outlined text-body-md' }, 'arrow_forward')
                    )
                  );
                })()
              )
            ),

            // BOTTOM ISLAND WAYPOINT DOCK (Desktop & Tablet quick navigation)
            e('nav', {
              'aria-label': 'World Island Navigation',
              className: 'relative z-20 w-full p-gutter-md sm:p-gutter-lg flex items-center justify-center pointer-events-none'
            },
              e('div', { className: 'aether-glass pointer-events-auto hidden lg:flex items-center gap-gutter-xs p-gutter-xs rounded-full border border-champagne-gold/35' },
                ISLANDS.map((isl) => {
                  const isActive = activeIslandId === isl.id;
                  return e('button', {
                    key: isl.id,
                    'data-component-id': isActive ? 'chip-filter' : 'chip-action',
                    'data-component-type': 'chip',
                    'data-component-variant': isActive ? 'filter' : 'action',
                    'aria-pressed': isActive ? 'true' : 'false',
                    type: 'button',
                    onClick: () => setActiveIslandId(isActive ? null : isl.id),
                    className: 'inline-flex items-center gap-gutter-xs px-gutter-md py-gutter-sm rounded-full transition-colors duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-champagne-gold ' +
                      (isActive
                        ? 'bg-primary text-on-primary shadow-sm'
                        : 'text-on-surface hover:bg-primary-container/70')
                  },
                    e('span', { className: 'material-symbols-outlined text-body-lg', 'aria-hidden': 'true' }, isl.icon),
                    e('span', { 'data-design-text-token': 'label-sm', className: 'font-label text-label-sm' }, isl.name)
                  );
                })
              ),
              // Compact mobile hint bar when no drawer is open
              !activeIsland && e('div', { className: 'lg:hidden aether-glass pointer-events-auto px-gutter-md py-gutter-xs rounded-full border border-champagne-gold/35 flex items-center gap-gutter-sm' },
                e('span', { className: 'material-symbols-outlined text-primary text-body-lg' }, 'touch_app'),
                e('span', { className: 'font-label text-label-sm text-on-surface' }, 'Tap any island or open menu')
              )
            )
          )
        );
      }

      const rootEl = document.getElementById('root');
      if (rootEl && typeof ReactDOM !== 'undefined') {
        ReactDOM.createRoot(rootEl).render(e(AetherApp));
      }
    })();
  </script>


</body></html>
